name: CI

on:
  pull_request:
  push:
    branches: [main]

# Postgres connection details match backend/app/config.py's default DATABASE_URL and
# backend/tests/conftest.py's default TEST_DATABASE_URL exactly, so no extra env vars are needed for
# any job below to find the database.
env:
  POSTGRES_USER: flightcompanion
  POSTGRES_PASSWORD: flightcompanion
  POSTGRES_DB: flightcompanion

jobs:
  backend:
    name: Backend (lint, unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flightcompanion
          POSTGRES_PASSWORD: flightcompanion
          POSTGRES_DB: flightcompanion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightcompanion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests (unit + integration)
        run: pytest -v

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, fixture mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flightcompanion
          POSTGRES_PASSWORD: flightcompanion
          POSTGRES_DB: flightcompanion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightcompanion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (backend runs in FIXTURE_MODE, no real API keys needed)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
