services:
  db:
    image: postgres:16-alpine
    container_name: flight-companion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightcompanion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightcompanion}
      POSTGRES_DB: ${POSTGRES_DB:-flightcompanion}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightcompanion}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
